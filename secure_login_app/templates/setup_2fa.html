{% extends "base.html" %}
{% block title %}2FA Setup{% endblock %}
{% block content %}
  <h1>Enable two-factor authentication</h1>
  <div class="sub">Scan the QR code below with Google Authenticator, Authy, or a similar app.</div>
  <div class="card" style="text-align:center; margin-bottom:16px;">
    <img src="{{ qr_data_uri }}" alt="2FA QR code" style="max-width:220px; border-radius:8px;">
    <div style="font-size:12px; color:#8087a1; margin-top:10px; word-break:break-all;">
      Manual entry key: {{ secret }}
    </div>
  </div>
  <form method="POST" action="{{ url_for('setup_2fa') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="code">Enter the 6-digit code from your app</label>
    <input type="text" id="code" name="code" maxlength="6" pattern="[0-9]{6}" required>
    <button type="submit">Enable 2FA</button>
  </form>
  <div class="foot"><a href="{{ url_for('dashboard') }}">Cancel, back to dashboard</a></div>
{% endblock %}
