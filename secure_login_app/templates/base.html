<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Secure Login System{% endblock %}</title>
<style>
  :root{
    --ink:#12172B; --paper:#EDEAE0; --gold:#C9A227; --red:#C1443C; --teal:#3E8E7E;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--ink); color:var(--paper);
    display:flex; justify-content:center; padding:60px 20px; min-height:100vh; margin:0;
  }
  .box{ width:100%; max-width:420px; }
  h1{ font-size:24px; margin-bottom:4px; }
  .sub{ color:#8087a1; font-size:14px; margin-bottom:24px; }
  form{ background:#1B2140; border-radius:12px; padding:24px; border:1px solid rgba(237,234,224,.08); }
  label{ display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:#8087a1; margin-bottom:6px; }
  input[type=text], input[type=password], input[type=email]{
    width:100%; padding:10px 12px; margin-bottom:16px; border-radius:6px;
    border:1px solid rgba(237,234,224,.15); background:var(--ink); color:var(--paper);
    font-size:15px; box-sizing:border-box;
  }
  button{
    width:100%; padding:11px; border-radius:6px; border:none; background:var(--gold);
    color:var(--ink); font-weight:600; cursor:pointer; font-size:14px;
  }
  button:hover{ opacity:.9; }
  .flash{ padding:10px 12px; border-radius:6px; margin-bottom:16px; font-size:13.5px; }
  .flash.error{ background:rgba(193,68,60,.15); border:1px solid rgba(193,68,60,.4); color:#eec5c1; }
  .flash.success{ background:rgba(62,142,126,.15); border:1px solid rgba(62,142,126,.4); color:#bfe3da; }
  a{ color:var(--gold); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  .foot{ margin-top:16px; font-size:13px; color:#8087a1; text-align:center; }
  .card{ background:#1B2140; border-radius:12px; padding:24px; border:1px solid rgba(237,234,224,.08); }
</style>
</head>
<body>
<div class="box">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
