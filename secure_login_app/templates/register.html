{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
  <h1>Create an account</h1>
  <div class="sub">Your password is hashed with bcrypt and never stored in plain text.</div>
  <form method="POST" action="{{ url_for('register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ form_username or '' }}" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ form_email or '' }}" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" required>

    <button type="submit">Register</button>
  </form>
  <div class="foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></div>
{% endblock %}
